[package]
name = "meshbool"
version = "3.5.2"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
test = ["dep:zngur", "dep:build-rs"]
test_thoroughly = ["test"]
server = ["borger_plugin_sdk/server"]
client = ["borger_plugin_sdk/client"]

[dependencies]
borger_plugin_sdk = { path = "../../../borger/plugins/sdk/rs" }

libm = { version = "0.2", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std", "libm-force"] }
intrusive-collections = { git = "https://github.com/BorgerLand/vandalized-intrusive-rs", default-features = false, features = ["alloc"]}
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }
reblessive = { version = "0.4", default-features = false }

[build-dependencies]
zngur = { version = "0.11", optional = true }
build-rs = { version = "0.3", optional = true}
