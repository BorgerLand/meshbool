[package]
name = "meshbool"
version = "3.5.1"
edition = "2024"
rust-version = "1.91"

[lib]
crate-type = ["staticlib"]

[features]
test = ["dep:zngur", "dep:build-rs"]
test_thoroughly = ["test"]

[dependencies]
libm = { version = "0.2", default-features = false }
nalgebra = { version = "0.35", default-features = false, features = ["std", "libm-force"] }
intrusive-collections = { git = "https://github.com/BorgerLand/vandalized-intrusive-rs" }
rustc-hash = { version = "2.1", default-features = false, features = ["std"] }

[build-dependencies]
zngur = { version = "0.10", optional = true }
build-rs = { version = "0.3", optional = true}
